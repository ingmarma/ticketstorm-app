global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'event-catalog'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['event-catalog:8080']
  - job_name: 'inventory'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['inventory:8080']
  - job_name: 'virtual-queue'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['virtual-queue:8080']
  - job_name: 'reservation'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['reservation:8080']
  - job_name: 'payment'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment:8080']
  - job_name: 'notification'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification:8080']
  - job_name: 'ai-discovery'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ai-discovery:8080']

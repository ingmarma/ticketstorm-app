## TicketStorm — Production override for AWS EC2
## Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
##
## - Disables Ollama (uses Bedrock instead)
## - Switches AI Discovery to AWS profile
## - Frontend uses production nginx config with API routing
## - All services use pre-built JARs

services:
  # ─── Disable Ollama (replaced by Bedrock) ───
  ollama:
    profiles:
      - never

  ollama-init:
    profiles:
      - never

  # ─── AI Discovery → Bedrock ───
  ai-discovery:
    environment:
      SPRING_PROFILES_ACTIVE: aws
      AWS_REGION: us-east-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      event-catalog:
        condition: service_started

  # ─── Frontend with production nginx ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketstorm-frontend-1
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - event-catalog
      - ai-discovery
      - virtual-queue
      - inventory
      - reservation
      - payment
    networks:
      - ticketstorm-net
    restart: unless-stopped

  # ─── Restart policies for production ───
  event-catalog:
    restart: unless-stopped

  virtual-queue:
    restart: unless-stopped

  inventory:
    restart: unless-stopped

  reservation:
    restart: unless-stopped

  payment:
    restart: unless-stopped

  notification:
    restart: unless-stopped

  prometheus:
    restart: unless-stopped

  grafana:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  kafka:
    restart: unless-stopped

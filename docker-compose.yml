version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ticketstorm-postgres-1
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/99-pgvector.sql:ro
    environment:
      POSTGRES_DB: ticketstorm
      POSTGRES_USER: ticketstorm
      POSTGRES_PASSWORD: ticketstorm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketstorm -d ticketstorm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketstorm-net

  redis:
    image: redis:7-alpine
    container_name: ticketstorm-redis-1
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketstorm-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: ticketstorm-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ticketstorm-net

  ollama:
    image: ollama/ollama:latest
    container_name: ticketstorm-ollama-1
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - ticketstorm-net

  ollama-init:
    image: ollama/ollama:latest
    container_name: ticketstorm-ollama-init-1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull llama3.2
        ollama pull nomic-embed-text
        echo "Ollama models ready"
    restart: "no"
    networks:
      - ticketstorm-net

  event-catalog:
    build:
      context: ./services/event-catalog-service
      dockerfile: Dockerfile
    container_name: ticketstorm-event-catalog-1
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketstorm
      SPRING_DATASOURCE_USERNAME: ticketstorm
      SPRING_DATASOURCE_PASSWORD: ticketstorm
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ticketstorm-net

  virtual-queue:
    build:
      context: ./services/virtual-queue-service
      dockerfile: Dockerfile
    container_name: ticketstorm-virtual-queue-1
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketstorm
      SPRING_DATASOURCE_USERNAME: ticketstorm
      SPRING_DATASOURCE_PASSWORD: ticketstorm
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ticketstorm-net

  inventory:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: ticketstorm-inventory-1
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketstorm
      SPRING_DATASOURCE_USERNAME: ticketstorm
      SPRING_DATASOURCE_PASSWORD: ticketstorm
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ticketstorm-net

  reservation:
    build:
      context: ./services/reservation-service
      dockerfile: Dockerfile
    container_name: ticketstorm-reservation-1
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketstorm
      SPRING_DATASOURCE_USERNAME: ticketstorm
      SPRING_DATASOURCE_PASSWORD: ticketstorm
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ticketstorm-net

  payment:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: ticketstorm-payment-1
    ports:
      - "8085:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketstorm
      SPRING_DATASOURCE_USERNAME: ticketstorm
      SPRING_DATASOURCE_PASSWORD: ticketstorm
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ticketstorm-net

  notification:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: ticketstorm-notification-1
    ports:
      - "8086:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketstorm
      SPRING_DATASOURCE_USERNAME: ticketstorm
      SPRING_DATASOURCE_PASSWORD: ticketstorm
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ticketstorm-net

  ai-discovery:
    build:
      context: ./services/ai-discovery-service
      dockerfile: Dockerfile
    container_name: ticketstorm-ai-discovery-1
    ports:
      - "8087:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_AI_OLLAMA_BASE_URL: ${SPRING_AI_OLLAMA_BASE_URL:-http://ollama:11434}
      EVENT_CATALOG_URL: http://event-catalog:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketstorm
      SPRING_DATASOURCE_USERNAME: ticketstorm
      SPRING_DATASOURCE_PASSWORD: ticketstorm
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      event-catalog:
        condition: service_started
    networks:
      - ticketstorm-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ticketstorm-prometheus-1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - ticketstorm-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ticketstorm-grafana-1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    depends_on:
      - prometheus
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - ticketstorm-net

networks:
  ticketstorm-net:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
